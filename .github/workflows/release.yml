name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, sign, notarize, and release
    runs-on: macos-15
    env:
      APP_BUNDLE: Reading List.app
      ARCH_FLAGS: --arch arm64 --arch x86_64
      SPARKLE_FRAMEWORK: .build/artifacts/sparkle/Sparkle/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework
      SPARKLE_BIN: .build/artifacts/sparkle/Sparkle/bin
    steps:
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$CERT_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add to search list
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

      - name: Build
        run: swift build -c release $ARCH_FLAGS

      - name: Assemble app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Find the compiled executable
          BIN_PATH="$(swift build -c release $ARCH_FLAGS --show-bin-path)"
          EXECUTABLE="$BIN_PATH/Reading List"

          if [[ ! -f "$EXECUTABLE" ]]; then
            echo "ERROR: Executable not found at $EXECUTABLE"
            ls -la "$BIN_PATH/"
            exit 1
          fi

          # Fail loudly rather than shipping a single-architecture build
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          echo "Built architectures: $ARCHS"
          for arch in arm64 x86_64; do
            if [[ "$ARCHS" != *"$arch"* ]]; then
              echo "ERROR: $arch slice missing from executable"
              exit 1
            fi
          done

          # Assemble .app bundle
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          mkdir -p "$APP_BUNDLE/Contents/Frameworks"
          cp "$EXECUTABLE" "$APP_BUNDLE/Contents/MacOS/Reading List"
          cp Info.plist "$APP_BUNDLE/Contents/Info.plist"

          # Embed Sparkle. The app has the network client entitlement, so
          # Sparkle's optional Downloader XPC service isn't needed.
          ditto "$SPARKLE_FRAMEWORK" "$APP_BUNDLE/Contents/Frameworks/Sparkle.framework"
          rm -rf "$APP_BUNDLE/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_BUNDLE/Contents/MacOS/Reading List"

          # Copy pre-compiled icon assets (built locally via actool from AppIcon.icon)
          cp Resources/AppIcon.icns "$APP_BUNDLE/Contents/Resources/AppIcon.icns"
          cp Resources/Assets.car "$APP_BUNDLE/Contents/Resources/Assets.car"
          cp Resources/PrivacyInfo.xcprivacy "$APP_BUNDLE/Contents/Resources/PrivacyInfo.xcprivacy"

          # Set version in Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP_BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(date +%Y%m%d%H%M%S)" "$APP_BUNDLE/Contents/Info.plist"

          echo "App bundle assembled at $APP_BUNDLE"
          ls -la "$APP_BUNDLE/Contents/MacOS/"

      - name: Sign app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          # Sign Sparkle's nested executables inside-out before the app itself
          SPARKLE="$APP_BUNDLE/Contents/Frameworks/Sparkle.framework"
          for item in \
            "$SPARKLE/Versions/B/XPCServices/Installer.xpc" \
            "$SPARKLE/Versions/B/Autoupdate" \
            "$SPARKLE/Versions/B/Updater.app" \
            "$SPARKLE"; do
            codesign --force --sign "$DEVELOPER_ID_APPLICATION" --options runtime --timestamp "$item"
          done

          codesign --force \
            --sign "$DEVELOPER_ID_APPLICATION" \
            --entitlements Entitlements.plist \
            --options runtime \
            --timestamp \
            "$APP_BUNDLE"

          codesign --verify --deep --strict "$APP_BUNDLE"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP_BUNDLE" "ReadingList-notarize.zip"

          xcrun notarytool submit "ReadingList-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple "$APP_BUNDLE"
          rm -f "ReadingList-notarize.zip"

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          mkdir -p dmg-staging
          cp -R "$APP_BUNDLE" dmg-staging/
          ln -s /Applications dmg-staging/Applications

          hdiutil create \
            -volname "Reading List" \
            -srcfolder dmg-staging \
            -ov \
            -format UDZO \
            "Reading-List-${VERSION}.dmg"

          codesign --force --sign "$DEVELOPER_ID_APPLICATION" --timestamp "Reading-List-${VERSION}.dmg"
          rm -rf dmg-staging

      - name: Create ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ditto -c -k --keepParent "$APP_BUNDLE" "Reading-List-${VERSION}.zip"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > release-notes.md
          gh api markdown -f text="$(cat release-notes.md)" -f mode=gfm \
            -f context="$GITHUB_REPOSITORY" > release-notes.html

      # The in-app updater reads the appcast from the latest release:
      # https://github.com/<repo>/releases/latest/download/appcast.xml
      - name: Create Sparkle appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          ZIP="Reading-List-${VERSION}.zip"
          SIGNATURE="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_BIN/sign_update" --ed-key-file - "$ZIP")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_BUNDLE/Contents/Info.plist")"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases"

          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Reading List</title>
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>${RELEASE_URL}/tag/${GITHUB_REF_NAME}</sparkle:fullReleaseNotesLink>
                <description><![CDATA[$(cat release-notes.html)]]></description>
                <enclosure url="${RELEASE_URL}/download/${GITHUB_REF_NAME}/${ZIP}" type="application/octet-stream" ${SIGNATURE} />
              </item>
            </channel>
          </rss>
          EOF

          xmllint --noout appcast.xml
          cat appcast.xml

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Reading List v${VERSION}" \
            --notes-file release-notes.md \
            "Reading-List-${VERSION}.dmg#Reading List ${VERSION} (DMG)" \
            "Reading-List-${VERSION}.zip#Reading List ${VERSION} (ZIP)" \
            appcast.xml

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
